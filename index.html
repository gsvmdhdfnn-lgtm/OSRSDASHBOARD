<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Task Organiser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Task Organiser</h1>
      <p class="summary" id="summary" aria-live="polite"></p>
    </header>

    <form class="add-form" id="add-form" novalidate>
      <label for="task-title" class="add-label">New task</label>
      <div class="add-row">
        <input
          id="task-title"
          name="title"
          type="text"
          maxlength="200"
          autocomplete="off"
          placeholder="e.g. Buy milk"
          aria-describedby="title-error"
        >
        <button type="submit" class="button button-primary">Add task</button>
      </div>
      <p class="error" id="title-error" role="alert"></p>
    </form>

    <div class="filters" role="group" aria-label="Show tasks">
      <button type="button" class="filter" data-filter="all" aria-pressed="true">
        All <span class="count" data-count="all">0</span>
      </button>
      <button type="button" class="filter" data-filter="outstanding" aria-pressed="false">
        Outstanding <span class="count" data-count="outstanding">0</span>
      </button>
      <button type="button" class="filter" data-filter="completed" aria-pressed="false">
        Completed <span class="count" data-count="completed">0</span>
      </button>
    </div>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading" class="visually-hidden">Tasks</h2>
      <ul class="task-list" id="task-list"></ul>

      <div class="empty" id="empty-state" hidden>
        <p class="empty-title" id="empty-title"></p>
        <p class="empty-text" id="empty-text"></p>
      </div>
    </section>

    <p class="status visually-hidden" id="status" aria-live="polite"></p>

    <footer class="storage-note">
      <p id="storage-note">
        Your tasks are saved only in this browser, on this device. They aren’t backed up or shared,
        and they will be lost if this browser’s storage or site data is cleared, or if you use a private window.
      </p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
