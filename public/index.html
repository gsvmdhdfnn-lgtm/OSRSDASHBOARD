<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a session</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1 id="business">Book a 1-to-1 session</h1>
    <p class="subtitle">60-minute sessions · All times are UK time</p>

    <section id="loading" class="card"><p class="muted">Loading available times…</p></section>
    <section id="load-error" class="card" hidden><p class="error"></p></section>

    <section id="pick" hidden>
      <p class="card error" id="notice" hidden></p>
      <div class="card">
        <div class="cal-head">
          <button id="prev" aria-label="Previous month">‹</button>
          <h2 id="month" style="margin:0"></h2>
          <button id="next" aria-label="Next month">›</button>
        </div>
        <div class="cal-grid" id="calendar"></div>
        <p id="none" class="muted" hidden>There are no free times at the moment. Please check back soon.</p>
      </div>

      <div class="card" id="times-card" hidden>
        <h2 id="times-title"></h2>
        <div class="times" id="times"></div>
      </div>

      <form class="card" id="form" hidden novalidate>
        <h2>Your details</h2>
        <div class="summary" id="summary"></div>
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" required maxlength="100">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="200">
        <label for="notes">Anything you'd like to cover? <span class="muted">(optional)</span></label>
        <textarea id="notes" name="notes" maxlength="1000"></textarea>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="error" id="form-error" hidden></p>
        <p style="margin:16px 0 0"><button class="primary" type="submit" id="submit">Confirm booking</button></p>
      </form>
    </section>

    <section id="done" class="card" hidden>
      <h2 class="success">You're booked in ✓</h2>
      <p id="done-text"></p>
      <p class="muted small" id="done-email" hidden>A confirmation email with a calendar invite is on its way. If you need to change anything, just reply to it.</p>
    </section>
  </main>
  <script src="/book.js"></script>
</body>
</html>
